<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Bide Hub</title>
  <link rel="icon" type="image/png" href="bidehub-social-profile-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <h1>Forgot Password?</h1>
      <p>Enter your email address and we'll send you a link to reset your password.</p>

      <form id="forgotPasswordForm">
        <label for="forgotPasswordEmail">Email</label>
        <input type="email" id="forgotPasswordEmail" placeholder="you@example.com"
          autocomplete="email" required />
        <button type="submit" id="forgotPasswordButton">Send Reset Link</button>
      </form>

      <p id="forgotPasswordMessage" role="status" aria-live="polite"></p>

      <p>Remember your password? <a href="login.html">Back to Login</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="password-recovery.js"></script>
</body>
</html>
