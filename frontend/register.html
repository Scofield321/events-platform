<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Event Platform</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="auth-container">
      <div class="auth-card">
        <h1>Join the Bide Hub</h1>

        <p>Create your service provider account.</p>

        <form id="registerForm">
          <label for="businessName">Business Name</label>
          <input
            type="text"
            id="businessName"
            placeholder="e.g. AKS Events"
            required
          />

          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="business@example.com"
            required
          />

          <label for="phone">Phone</label>
          <input type="tel" id="phone" placeholder="0700 000 000" required />

          <label for="location">Location</label>
          <input
            type="text"
            id="location"
            placeholder="e.g. Kampala"
            required
          />

          <label for="password">Password</label>

          <div class="password-field">
            <input
              type="password"
              id="password"
              placeholder="Create a password"
              required
            />

            <span
              class="password-toggle"
              data-target="password"
              role="button"
              tabindex="0"
              aria-label="Show password"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </span>
          </div>

          <button type="submit" id="registerButton">Create Account</button>
        </form>

        <p id="registerMessage"></p>

        <p>
          Already have an account?
          <a href="login.html">Login</a>
        </p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
