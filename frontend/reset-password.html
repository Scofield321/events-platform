<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Bide Hub</title>
  <link rel="icon" type="image/png" href="bidehub-social-profile-logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-container">
    <div class="auth-card">
      <h1>Reset Your Password</h1>
      <p>Choose a new password for your Bide Hub account.</p>

      <p id="recoveryStatus" role="status" aria-live="polite">Verifying your reset link...</p>

      <form id="resetPasswordForm" hidden>
        <label for="newPassword">New Password</label>
        <div class="password-field">
          <input type="password" id="newPassword" placeholder="Enter a new password"
            minlength="8" autocomplete="new-password" required />
          <span class="password-toggle" data-target="newPassword" role="button"
            tabindex="0" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
        </div>

        <label for="confirmPassword">Confirm New Password</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="Re-enter your new password"
            minlength="8" autocomplete="new-password" required />
          <span class="password-toggle" data-target="confirmPassword" role="button"
            tabindex="0" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
        </div>

        <button type="submit" id="resetPasswordButton">Update Password</button>
      </form>

      <p id="resetPasswordMessage" role="status" aria-live="polite"></p>
      <p><a href="login.html">Back to Login</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="password-recovery.js"></script>
</body>
</html>
